# Generated from ci/pin_check.py:ci_workflow; review both together.
name: landing-template-ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  SEMGREP_SEND_METRICS: 'off'
  SEMGREP_ENABLE_VERSION_CHECK: '0'
  npm_config_update_notifier: 'false'
# Network acquisition is confined to the download step, plus the owner-approved
# live OSV query. All installs use verified local artifacts and complete locks.
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
      options: --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - name: Exact secret-free checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pins and workflow coverage
        run: python -I ci/pin_check.py
      - name: Run tests
        run: |
          set -euo pipefail
          python -I -m unittest discover -s ci -p test_static.py
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: node@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
      options: --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - name: Exact secret-free checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pins and workflow coverage
        run: node ci/npm_tool.mjs validate
      - name: Download hash-checked tool closure
        run: node ci/npm_tool.mjs download
      - name: Install verified local artifacts offline
        run: node ci/npm_tool.mjs install
      - name: Run playwright
        run: |
          set -euo pipefail
          node ci/playwright_e2e.mjs playwright
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: node@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
      options: --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - name: Exact secret-free checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pins and workflow coverage
        run: node ci/npm_tool.mjs validate
      - name: Download hash-checked tool closure
        run: node ci/npm_tool.mjs download
      - name: Install verified local artifacts offline
        run: node ci/npm_tool.mjs install
      - name: Run lighthouse
        run: |
          set -euo pipefail
          node ci/playwright_e2e.mjs lighthouse
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
      options: --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - name: Exact secret-free checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pins and workflow coverage
        run: python -I ci/pin_check.py
      - name: Download hash-checked tool closure
        run: python -I ci/install_tool.py --download gitleaks
      - name: Install verified local artifacts offline
        run: python -I ci/install_tool.py gitleaks
      - name: Run gitleaks
        run: |
          set -euo pipefail
          .tools/gitleaks/bin/gitleaks dir public --redact --no-banner
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
      options: --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - name: Exact secret-free checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pins and workflow coverage
        run: python -I ci/pin_check.py
      - name: Download hash-checked tool closure
        run: python -I ci/install_tool.py --download semgrep
      - name: Install verified local artifacts offline
        run: python -I ci/install_tool.py semgrep
      - name: Run semgrep
        run: |
          set -euo pipefail
          .tools/semgrep/bin/semgrep scan --config ci/semgrep.yml --metrics=off --disable-version-check --error --strict public
  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
      options: --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - name: Exact secret-free checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pins and workflow coverage
        run: python -I ci/pin_check.py
      - name: Download hash-checked tool closure
        run: python -I ci/install_tool.py --download osv-scanner
      - name: Install verified local artifacts offline
        run: python -I ci/install_tool.py osv-scanner
      - name: Run osv-scanner
        run: |
          set -euo pipefail
          python -I ci/install_tool.py --scan-osv
  license-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
      options: --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - name: Exact secret-free checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pins and workflow coverage
        run: python -I ci/pin_check.py
      - name: Run license-check
        run: |
          set -euo pipefail
          python -I ci/check.py license-check
  artifact-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
      options: --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - name: Exact secret-free checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pins and workflow coverage
        run: python -I ci/pin_check.py
      - name: Run artifact-integrity
        run: |
          set -euo pipefail
          python -I ci/check.py artifact-integrity
