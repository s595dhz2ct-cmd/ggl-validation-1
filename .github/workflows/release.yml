name: Release
on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Owner-reviewed protected-main commit (full SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: foundry-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.exact_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Block until reviewed build image, target manifest and workflow commit exist
        run: |
          echo 'skipped-with-reason unresolved_release_pins; no checkout, build or artifact upload'
          exit 1
      - name: Prepared exact checkout (build image remains null)
        if: ${{ false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.exact_sha }}
          persist-credentials: false
      - name: Prepared public artifact upload (build image remains null)
        if: ${{ false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-public-artifact
          path: public/
          if-no-files-found: error
          retention-days: 1
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Read-only source/tree/workflow/check/promotion and artifact verifier
        run: |
          echo 'skipped-with-reason unresolved_verifier_image; hash/ID attestation unavailable'
          exit 1
      - name: Prepared artifact download (verifier image remains null)
        if: ${{ false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-public-artifact
          path: artifact/
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.exact_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: production
    permissions:
      contents: none
      id-token: write
    steps:
      - name: Block before identity bootstrap or deployment credential use
        run: |
          echo 'skipped-with-reason unresolved_fixed_deploy_image_and_private_identity'
          exit 1
      - name: Prepared private transport (runtime hash and private identity remain null)
        if: ${{ false }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
      # HUMAN H2/H3 replaces this barrier only after exact image/Action/tool hashes,
      # issuer keys, target IDs and private ACL are independently reviewed.
      # Prepared Actions above remain inactive; a reviewed fixed deploy image
      # (no source checkout or project scripts) must rehash the exact
      # attested artifact and protected-main evidence, verify the fixed destination,
      # obtain OIDC with audience foundry-build-deploy, POST /build/ci/authorize,
      # immediately POST /build/ci/dispatch, and upload only after consumption.
      # Credentials are production Environment secrets, resolved inside that image.
      # Completion returns only IDs/hashes through /build/ci/dispatch; ambiguity
      # stops for HUMAN reconciliation. There is no automatic retry/preview route.
