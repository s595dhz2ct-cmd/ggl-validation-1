name: Release
on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Owner-reviewed protected-main commit (full SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: foundry-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.exact_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Block until reviewed build image, target manifest and workflow commit exist
        run: |
          echo 'skipped-with-reason unresolved_release_pins; no checkout, build or artifact upload'
          exit 1
      - name: Prepared exact checkout (build image remains null)
        if: ${{ false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.exact_sha }}
          persist-credentials: false
      - name: Prepared public artifact upload (build image remains null)
        if: ${{ false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-public-artifact
          path: public/
          if-no-files-found: error
          retention-days: 1
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Read-only source/tree/workflow/check/promotion and artifact verifier
        run: |
          echo 'skipped-with-reason unresolved_verifier_image; hash/ID attestation unavailable'
          exit 1
      - name: Prepared artifact download (verifier image remains null)
        if: ${{ false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-public-artifact
          path: artifact/
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.exact_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: production
    permissions:
      contents: none
      id-token: write
    steps:
      - name: Block before identity bootstrap or deployment credential use
        run: |
          echo 'skipped-with-reason unresolved_fixed_deploy_image_and_private_identity'
          exit 1
      - name: Prepared private transport (runtime hash and private identity remain null)
        if: ${{ false }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
      - name: Prepared verified public artifact download (deploy image remains null)
        if: ${{ false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-public-artifact
          path: /release/public/
      - name: Prepared verifier attestation download (verifier image remains null)
        if: ${{ false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-attestation
          path: /release/
      - name: Prepared credential-free CI authorize and dispatch
        if: ${{ false }}
        env:
          FOUNDRY_DEPLOY_TOOL_VERSION: '4.142.0'
          FOUNDRY_DEPLOY_TOOL_SHA256: 'null'
          FOUNDRY_DEPLOY_TOOL_LOCK: /opt/foundry/deploy-tool/package-lock.json
          FOUNDRY_DEPLOY_TOOL_LOCK_SHA256: a0f6c272284f60c48eac81db876052f3562c2b000cf0e197ff34c5782d349439
          FOUNDRY_DEPLOY_TOOL_INTEGRITY: sha512-oqquqqtHOevn17hzI7qRzU+MiOaCU2UZRLPIZStjGlhwYbxe3hk4Stq3knfcIlGfMSfgM4iycZKeb1fEF5mRTQ==
          FOUNDRY_EXACT_SHA: ${{ inputs.exact_sha }}
        run: |
          # Future pinned source-free image and bounded OIDC bootstrap only.
          # No hosting token in this process. Freeze the verified artifact and
          # write a private typed handoff after single-use permit consumption.
          python -m foundry.build.hosting authorize
      - name: Prepared fixed uploader with private dispatch handoff
        if: ${{ false }}
        env:
          FOUNDRY_DEPLOY_TOOL_VERSION: '4.142.0'
          FOUNDRY_DEPLOY_TOOL_SHA256: 'null'
          FOUNDRY_DEPLOY_TOOL_LOCK: /opt/foundry/deploy-tool/package-lock.json
          FOUNDRY_DEPLOY_TOOL_LOCK_SHA256: a0f6c272284f60c48eac81db876052f3562c2b000cf0e197ff34c5782d349439
          FOUNDRY_DEPLOY_TOOL_INTEGRITY: sha512-oqquqqtHOevn17hzI7qRzU+MiOaCU2UZRLPIZStjGlhwYbxe3hk4Stq3knfcIlGfMSfgM4iycZKeb1fEF5mRTQ==
          FOUNDRY_EXACT_SHA: ${{ inputs.exact_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Separate process supplied by the future pinned deploy image.
          # Image assembly must use ci/deploy-tool/package-lock.json with
          # hash verification and npm ci --offline --ignore-scripts.
          # The lock hash is separate from the unresolved executable hash.
          # Claim the private handoff once, repeat expiry/artifact/destination/
          # protected-commit/tool checks, then invoke only the fixed uploader.
          # No source checkout, project scripts, OIDC or private CI calls here.
          python -m foundry.build.hosting upload
      # HUMAN H2/H3 replaces the first barrier only after exact image/Action/tool
      # hashes, issuer keys, target IDs and private ACL are independently reviewed.
      # Every prepared step remains inactive. Immutable image/runtime pins,
      # reviewed mounts and private identity delivery are still unresolved.
      # The Environment token is scoped only to the final fixed uploader process.
      # An ambiguous result stops for HUMAN reconciliation without retry.
